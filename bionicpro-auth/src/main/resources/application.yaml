bionicpro:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  session:
    cookie-name: BIONICPRO_SESSION
    ttl: ${SESSION_TTL:30m}
    secure-cookie: ${SESSION_SECURE_COOKIE:true}
    encryption-key: ${SESSION_ENCRYPTION_KEY:}
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/reports-realm}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    internal-auth-server-url: ${KEYCLOAK_INTERNAL_AUTH_SERVER_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:reports-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:bionicpro-auth}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:bionicpro-auth-secret}
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:8000/auth/callback}
  report-storage:
    endpoint: ${REPORT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${REPORT_STORAGE_REGION:us-east-1}
    access-key: ${REPORT_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${REPORT_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${REPORT_STORAGE_BUCKET:bionicpro-reports}
    cdn-base-url: ${REPORT_CDN_BASE_URL:http://localhost:8082/reports-cache}
server:
  port: 8000
  forward-headers-strategy: framework
spring:
  application:
    name: bionicpro-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/reports_olap}
    username: ${SPRING_DATASOURCE_USERNAME:reports_user}
    password: ${SPRING_DATASOURCE_PASSWORD:reports_password}
